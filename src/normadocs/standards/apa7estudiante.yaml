citation_style: apa
citations:
  ampersand: true
  et_al_min_authors: 3
block_quote:
  indent_inches: 0.5
  min_words: 40
equations:
  center_tab_inches: 3.25
  format: "({n})"
  numbering: true
  right_tab_inches: 6.5
figures:
  caption_above: true
  caption_prefix: Figura
  nota_prefix: Nota.
  title_above: true
references:
  italicize_journals: true
  sort: true
fonts:
  body:
    name: Times New Roman
    size: 12
  headings:
    level1:
      alignment: center
      bold: true
    level2:
      alignment: left
      bold: true
    level3:
      alignment: left
      bold: true
      italic: true
    name: Times New Roman
margins:
  bottom: 1
  left: 1
  right: 1
  top: 1
  unit: inches
name: APA 7th Edition
page_setup:
  first_page_number: 1
  header: true
  page_numbers: true
running_head:
  enabled: false
  max_length: 50
spacing:
  line: double
  paragraph_after: 0
  paragraph_before: 0
tables:
  borders: horizontal_only
  caption_above: true
  caption_prefix: Tabla
  note_suffix: Elaboración propia.
  vertical_align: top
version: '7.0'
