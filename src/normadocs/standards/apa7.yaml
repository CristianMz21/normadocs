name: "APA 7th Edition"
version: "7.0"
citation_style: apa

fonts:
  body:
    name: "Times New Roman"
    size: 12
  headings:
    name: "Times New Roman"
    level1:
      alignment: center
      bold: true
    level2:
      alignment: left
      bold: true
    level3:
      alignment: left
      bold: true
      italic: true

margins:
  unit: inches
  top: 1
  bottom: 1
  left: 1
  right: 1

spacing:
  line: double
  paragraph_before: 0
  paragraph_after: 0

page_setup:
  page_numbers: true
  header: true
  first_page_number: 1

citations:
  et_al_min_authors: 3
  ampersand: true

block_quote:
  min_words: 40
  indent_inches: 0.5

references:
  sort: true
  italicize_journals: true

equations:
  numbering: true
  format: "({n})"
  center_tab_inches: 3.25
  right_tab_inches: 6.5

tables:
  borders: horizontal_only
  caption_prefix: "Table"
  caption_above: true
  note_suffix: "Elaboración propia."
  vertical_align: top

figures:
  caption_prefix: "Figure"
  caption_above: true
  title_above: true
  nota_prefix: "Nota."

running_head:
  enabled: true
  max_length: 50
