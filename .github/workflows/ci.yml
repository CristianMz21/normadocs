name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ~/.cache/pip
  UV_SYSTEM_PYTHON: 1

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Lint with Ruff (no noqa allowed)
        run: uv run ruff check src/ tests/ --output-format=github --no-cache
        env:
          RUFF_NOQA: "1"

      - name: Format check with Ruff
        run: uv run ruff format --check src/ tests/ --output-format=github --no-cache

      - name: Type check with MyPy
        run: uv run mypy --strict src/

      - name: Type check with Pyright
        run: uv run pyright

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Run Bandit
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Run Semgrep (advanced SAST)
        run: uv run semgrep scan --config p/python --config p/security-audit --error --metrics off src/

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Run tests with coverage (warnings as errors)
        run: >-
          uv run pytest tests/ -W error --cov=normadocs
          --cov-report=term-missing --cov-report=xml --cov-fail-under=78

      - name: Upload coverage (3.13 only)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov (3.13 only)
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          file: coverage.xml
          fail_ci_if_error: false

  build-check:
    name: Build Distribution
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  annotations-check:
    name: Ensure Zero Annotations
    needs: [quality, security, gitleaks, tests, build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check for annotations
        shell: bash
        run: |
          repo_full="${{ github.repository }}"
          run_id="${{ github.run_id }}"

          echo "Checking run $run_id for annotations in $repo_full..."

          annotations=$(gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[].annotations // [] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || echo "0")

          if [ -n "$annotations" ] && [ "$annotations" -gt 0 ] 2>/dev/null; then
            echo "Found $annotations annotation(s):"
            gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[] | select(.annotations | length > 0) | .name as $job | .annotations[] | "\($job): \(.message) (\(.path):\(.start_line))"' 2>/dev/null
            echo ""
            echo "::error::CI failed: $annotations annotation(s) found. Fix all warnings before merging."
            exit 1
          else
            echo "No annotations found. CI passed with zero warnings!"
          fi
