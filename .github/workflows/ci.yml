name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ~/.cache/pip
  UV_SYSTEM_PYTHON: 1

jobs:
  changes:
    name: Detect code changes
    # Docs-only PRs (docs/**, markdown, changelog) skip the heavy jobs to
    # save Actions credits. Skipped required checks still satisfy branch
    # protection; docs PRs are validated by docs-build below + docs.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements-ci.txt'
              - 'uv.lock'
              - 'Makefile'
              - 'Dockerfile'
              - 'docker/**'
              - '.github/workflows/**'

  docs-build:
    name: Docs Build (strict)
    # Always runs: the meaningful validation for docs-only changes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "docs/requirements.lock"

      - name: Install documentation dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r docs/requirements.lock

      - name: Build documentation (strict)
        run: mkdocs build --strict
        working-directory: docs

  quality:
    name: Lint & Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Lint with Ruff (no noqa allowed)
        run: ruff check src/ tests/ --output-format=github --no-cache
        env:
          RUFF_NOQA: "1"

      - name: Format check with Ruff
        run: ruff format --check src/ tests/ --output-format=github --no-cache

      - name: Type check with MyPy
        run: mypy --strict src/

      - name: Type check with Pyright
        # Optional imports (imgkit, weasyprint, sqlparse, fitz, pdfplumber)
        # live in extras, so sync them for pyright resolution.
        # --frozen --no-build satisfy Sonar S8544/S8541; --no-binary-package
        # allows the local editable install (no wheel) while blocking
        # third-party sdist builds.
        run: uv run --frozen --no-build --no-binary-package normadocs --extra codeimage --extra pdf --extra pdf-verifier pyright

  security:
    name: Security Scan
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Run Bandit
        run: bandit -r src/ -c pyproject.toml

      - name: Run Semgrep (advanced SAST)
        run: semgrep scan --config p/python --config p/security-audit --error --metrics off src/

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [quality, security, changes]
    # No job-level if: matrix legs must report for branch protection.
    # Docs-only gating is step-level (echo leg, ~30s).
    # always(): skipped needs (quality/security on docs-only) must not skip
    # this job, or the matrix legs would never report.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Matrix legs must report a conclusion for branch protection, so the
      # docs-only skip is step-level (not job-level): docs-only runs execute
      # only the echo step below (~30s per leg instead of the full suite).
      - name: Docs-only change (tests skipped by policy)
        if: ${{ needs.changes.outputs.code != 'true' }}
        run: echo "Docs-only change - full matrix runs on code changes - local gate is make check"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install system deps
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies (locked)
        if: needs.changes.outputs.code == 'true'
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Install project (editable, no deps)
        if: needs.changes.outputs.code == 'true'
        # requirements-ci.txt holds deps only; install the project itself so
        # system python (which runs pytest) can import normadocs.
        run: pip install --no-deps -e .

      - name: Run tests with coverage (warnings as errors)
        if: needs.changes.outputs.code == 'true'
        run: >-
          python -m pytest tests/ -W error --cov=normadocs
          --cov-report=term-missing --cov-report=xml --cov-fail-under=78

      - name: Upload coverage (3.13 only)
        if: matrix.python-version == '3.13' && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov (3.13 only)
        if: matrix.python-version == '3.13' && needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          file: coverage.xml
          fail_ci_if_error: false

  build-check:
    name: Build Distribution
    needs: [tests, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  annotations-check:
    name: Ensure Zero Annotations
    needs: [quality, security, gitleaks, tests, build-check, changes, docs-build]
    # always(): must aggregate even when docs-only skips upstream jobs.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check for annotations
        shell: bash
        run: |
          repo_full="${{ github.repository }}"
          run_id="${{ github.run_id }}"

          echo "Checking run $run_id for annotations in $repo_full..."

          annotations=$(gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[].annotations // [] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || echo "0")

          if [ -n "$annotations" ] && [ "$annotations" -gt 0 ] 2>/dev/null; then
            echo "Found $annotations annotation(s):"
            gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[] | select(.annotations | length > 0) | .name as $job | .annotations[] | "\($job): \(.message) (\(.path):\(.start_line))"' 2>/dev/null
            echo ""
            echo "::error::CI failed: $annotations annotation(s) found. Fix all warnings before merging."
            exit 1
          else
            echo "No annotations found. CI passed with zero warnings!"
          fi
