name: SonarCloud

# Quality-gate consolidation (bugs, code smells, coverage, duplication).
# SONAR_TOKEN is stored as a secret of the "pypi" environment, so the job
# references it. Environment secrets are NOT visible to a job-level `if`,
# hence the availability gate as the first step: without the token (e.g.
# fork PRs) the remaining steps are skipped and the job passes as a no-op.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    steps:
      - name: Check SONAR_TOKEN availability
        id: sonar_gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "SONAR_TOKEN is not set; skipping SonarCloud analysis."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.sonar_gate.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # SonarCloud needs full history for blame/SCM metrics

      - name: Set up Python
        if: steps.sonar_gate.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install UV
        if: steps.sonar_gate.outputs.available == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install system deps
        if: steps.sonar_gate.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies (locked)
        if: steps.sonar_gate.outputs.available == 'true'
        run: uv sync --frozen --extra dev --python 3.13

      - name: Run tests with coverage
        if: steps.sonar_gate.outputs.available == 'true'
        run: uv run pytest tests/ --cov=normadocs --cov-report=xml -q

      - name: SonarCloud Scan
        if: steps.sonar_gate.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
