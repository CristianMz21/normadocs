name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ~/.cache/pip
  UV_SYSTEM_PYTHON: 1

jobs:
  validate-tag:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::Invalid tag format. Expected v*.*.*"
            exit 1
          fi
          echo "TAG_VERSION=$TAG" >> $GITHUB_ENV
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Validate version matches pyproject.toml
        run: |
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version validated successfully"

  check-pypi:
    name: Check PyPI Status
    needs: [validate-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Checking if version $VERSION exists on PyPI..."
          RESPONSE=$(curl -s "https://pypi.org/pypi/normadocs/$VERSION/json")
          PULLUP_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version','NOT_FOUND'))" 2>/dev/null)
          echo "Found version on PyPI: '$PULLUP_VERSION'"
          if [ "$PULLUP_VERSION" = "$VERSION" ]; then
            echo "already_published=true" >> $GITHUB_ENV
            echo "Version $VERSION already exists on PyPI."
          else
            echo "already_published=false" >> $GITHUB_ENV
            echo "Version $VERSION not found on PyPI. Will upload."
          fi

  quality:
    name: Lint & Type Check
    needs: [validate-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Lint with Ruff (no noqa allowed)
        run: ruff check src/ tests/ --output-format=github --no-cache
        env:
          RUFF_NOQA: "1"

      - name: Format check with Ruff
        run: ruff format --check src/ tests/ --output-format=github --no-cache

      - name: Type check with MyPy
        run: mypy --strict src/

  security:
    name: Security Scan
    needs: [validate-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Run Bandit
        run: bandit -r src/ -c pyproject.toml

  tests:
    name: Tests (Python 3.13)
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Install project (editable, no deps)
        # requirements-ci.txt holds deps only; install the project itself so
        # system python (which runs pytest) can import normadocs.
        run: pip install --no-deps -e .

      - name: Run tests with coverage (warnings as errors)
        run: >-
          python -m pytest tests/ -W error --cov=normadocs
          --cov-report=term-missing --cov-fail-under=78

  build-check:
    name: Build Distribution
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  annotations-check:
    name: Ensure Zero Annotations
    needs: [quality, security, tests, build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check for annotations
        shell: bash
        run: |
          repo_full="${{ github.repository }}"
          run_id="${{ github.run_id }}"

          echo "Checking run $run_id for annotations in $repo_full..."

          annotations=$(gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[].annotations // [] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || echo "0")

          if [ -n "$annotations" ] && [ "$annotations" -gt 0 ] 2>/dev/null; then
            echo "Found $annotations annotation(s):"
            gh api repos/$repo_full/actions/runs/$run_id/jobs --jq '.jobs[] | select(.annotations | length > 0) | .name as $job | .annotations[] | "\($job): \(.message) (\(.path):\(.start_line))"' 2>/dev/null
            echo ""
            echo "::error::CI failed: $annotations annotation(s) found. Fix all warnings before merging."
            exit 1
          else
            echo "No annotations found. CI passed with zero warnings!"
          fi

  publish:
    name: Upload to PyPI
    needs: [annotations-check, check-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.check-pypi.outputs.already_published != 'true'
    permissions:
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/p/normadocs
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  publish-skipped:
    name: Publish Skipped
    needs: [annotations-check, check-pypi]
    runs-on: ubuntu-latest
    if: needs.check-pypi.outputs.already_published == 'true'
    permissions:
      contents: read
    steps:
      - name: Version already published
        run: |
          echo "========================================"
          echo "Skipping PyPI publish - version already exists"
          echo "normadocs is already published at:"
          echo "https://pypi.org/project/normadocs/"
          echo "========================================"
