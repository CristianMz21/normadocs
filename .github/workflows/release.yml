name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ~/.cache/pip
  UV_SYSTEM_PYTHON: 1

jobs:
  validate-tag:
    name: Validate Version Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.VERSION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::Invalid tag format. Expected v*.*.*"
            exit 1
          fi
          echo "TAG_VERSION=$TAG" >> $GITHUB_ENV
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Validate version matches pyproject.toml
        run: |
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version validated successfully"

  ci:
    name: Continuous Integration
    needs: [validate-tag]
    uses: ./.github/workflows/ci.yml

  check-pypi:
    name: Check PyPI Status
    needs: [validate-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Checking if version $VERSION exists on PyPI..."
          RESPONSE=$(curl -s "https://pypi.org/pypi/normadocs/$VERSION/json")
          PULLUP_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version','NOT_FOUND'))" 2>/dev/null)
          echo "Found version on PyPI: '$PULLUP_VERSION'"
          if [ "$PULLUP_VERSION" = "$VERSION" ]; then
            echo "already_published=true" >> $GITHUB_ENV
            echo "Version $VERSION already exists on PyPI."
          else
            echo "already_published=false" >> $GITHUB_ENV
            echo "Version $VERSION not found on PyPI. Will upload."
          fi

  publish:
    name: Upload to PyPI
    needs: [ci, check-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: needs.check-pypi.outputs.already_published != 'true'
    permissions:
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/p/normadocs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies (locked)
        run: pip install --no-build --only-binary ":all:" --require-hashes -r requirements-ci.txt

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  publish-skipped:
    name: Publish Skipped
    needs: [ci, check-pypi]
    runs-on: ubuntu-24.04
    if: needs.check-pypi.outputs.already_published == 'true'
    permissions:
      contents: read
    steps:
      - name: Version already published
        run: |
          echo "========================================"
          echo "Skipping PyPI publish - version already exists"
          echo "normadocs is already published at:"
          echo "https://pypi.org/project/normadocs/"
          echo "========================================"
