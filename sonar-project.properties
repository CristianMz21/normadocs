# SonarCloud project configuration.
# TODO: adjust sonar.organization and sonar.projectKey to the SonarCloud values
# created for this repository (usually <org> and <org>_<repo>), then set the
# SONAR_TOKEN secret to activate .github/workflows/sonarcloud.yml.
sonar.projectKey=CristianMz21_normadocs
sonar.organization=cristianmz21

sonar.sources=src
sonar.tests=tests

sonar.python.version=3.10, 3.11, 3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=docs/**,examples/**,scripts/**,dist/**,ExportDocs/**,.github/**,**/.github/**,**/*.yml,**/*.yaml
sonar.test.exclusions=tests/temp_*

# Suppress false-positive GitHub Actions pip vulnerabilities (uv handles locking)
sonar.issue.ignore.multicriteria=s8541,s8544
sonar.issue.ignore.multicriteria.s8541.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.s8541.resourceKey=**/*
sonar.issue.ignore.multicriteria.s8544.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.s8544.resourceKey=**/*
