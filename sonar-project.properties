# SonarCloud project configuration.
# TODO: adjust sonar.organization and sonar.projectKey to the SonarCloud values
# created for this repository (usually <org> and <org>_<repo>), then set the
# SONAR_TOKEN secret to activate .github/workflows/sonarcloud.yml.
sonar.projectKey=CristianMz21_normadocs
sonar.organization=cristianmz21
sonar.projectVersion=0.2.6

sonar.sources=src
sonar.tests=tests

sonar.python.version=3.10, 3.11, 3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=docs/**,examples/**,scripts/**,dist/**,ExportDocs/**,.github/**,**/.github/**,**/*.yml,**/*.yaml
sonar.test.exclusions=tests/temp_*

# Use reference branch for new code (more predictable than previous_version for public repo)
sonar.newCode.referenceBranch=main

# Strict: suppress only workflow files (uv handles locking, NOSONAR ignored for yaml)
sonar.issue.ignore.allfile=a1
sonar.issue.ignore.allfile.a1.fileRegexp=\.github\/workflows\/.*\.yml
