site_name: NormaDocs
site_description: >-
  NormaDocs converts Markdown to academically-formatted DOCX and PDF
  documents following APA 7th Edition, ICONTEC NTC 1486, and IEEE 8th
  Edition standards.
site_url: https://cristianmz21.github.io/normadocs/
repo_url: https://github.com/CristianMz21/normadocs
repo_name: CristianMz21/normadocs
edit_uri: edit/main/src/

docs_dir: src

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - git-revision-date-localized:
      enabled: !ENV [CI, false]

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Usage:
      - CLI: usage/cli.md
      - Python API: usage/library.md
  - Standards:
      - Overview: standards/index.md
      - APA 7th Edition: standards/apa7.md
      - ICONTEC NTC 1486: standards/icontec.md
      - IEEE 8th Edition: standards/ieee.md
  - Guides:
      - Examples: examples.md
      - Bibliography: bibliography.md
      - PDF Output: pdf-output.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Contributing: contributing.md
      - Community: community.md
      - Security: security.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
  - Reference:
      - Format Reference: reference/formats.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - toc:
      permalink: true
