# openspec/config.yaml — NormaDocs (normadocs) SDD bootstrap
# Generated by sdd-init hybrid mode — 2026-08-28
# User preference: "lo más robusto y completo posible" → Interactive + hybrid + strict TDD + max security scrutiny

schema: spec-driven
artifact_store: hybrid
execution_mode: interactive

context: |
  Project: normadocs (repo CristianMz21/normadocs, dir APAScript) — Markdown → academic DOCX/PDF (APA7/ICONTEC/IEEE)
  Stack: Python 3.10+ (requires-python >=3.10, CI matrix 3.10-3.13, dev 3.14.6), Typer+Click CLI, python-docx, PyYAML, Pillow, opencv-python+pytesseract (OCR), pandoc subprocess (PATH), LibreOffice/WeasyPrint PDF, LanguageTool opt-in
  Architecture: Pipeline MarkdownPreprocessor → PandocRunner → DocumentFormatter (python-docx, formatters/apa subpackage + icontec/ieee) → PDF + APA verifier; CLI entry src/normadocs/cli.py (Typer normadocs convert, 9 stages)
  Testing: pytest 8.3.2 + pytest-cov 7, coverage gate 78 (CI authoritative, Makefile uses 86), strict TDD enabled
  Style: ruff line-length 100 (E/F/W/I/UP/B/SIM/RUF), mypy --strict, pyright standard (src/), zero-suppression policy (RUFF_NOQA=1, no noqa/type:ignore/nosec/B###/pyright:ignore), conventional commits, PEP 561 py.typed

# Project context persisted to Engram topic sdd-init/APAScript (hybrid: also here)
project: APAScript
repo: CristianMz21/normadocs
version: "0.2.6"
python:
  requires: ">=3.10"
  ci_matrix: ["3.10", "3.11", "3.12", "3.13"]
  local: "3.14.6"
  build_backend: hatchling

testing:
  strict_tdd: true
  reason: "pytest runner detected + coverage gate 78; no marker/config disables TDD → default strict_tdd true per SDD Decision Gates"
  test_command: "pytest tests/ -W error --cov=normadocs --cov-report=term-missing --cov-report=xml --cov-fail-under=78"
  # Makefile test-cov uses --cov-fail-under=86 (stricter locally); CI is authoritative at 78
  test_command_local_strict: "pytest tests/ -W error --cov=normadocs --cov-report=term-missing --cov-report=xml --cov-fail-under=86"
  framework: pytest
  layers:
    unit: { available: true, tool: "pytest tests/unit/" }
    integration: { available: true, tool: "pytest tests/test_*.py (cli/e2e/formatters/verifier)" }
    e2e: { available: true, tool: "pytest tests/test_e2e.py + pandoc on PATH" }
  coverage:
    available: true
    tool: pytest-cov
    threshold: 78
    local_threshold: 86
    report: coverage.xml
  quality_tools:
    linter: { available: true, command: "ruff check src/ tests/ --output-format=github --no-cache (RUFF_NOQA=1)" }
    formatter: { available: true, command: "ruff format --check src/ tests/ --no-cache" }
    type_checker_mypy: { available: true, command: "mypy --strict src/" }
    type_checker_pyright: { available: true, command: "pyright (via npx pyright 1.1.413, tool.pyright include=[src] typeCheckingMode=standard)" }
    security_bandit: { available: true, command: "bandit -r src/normadocs -c pyproject.toml" }
    security_semgrep: { available: true, command: "semgrep scan --config p/python --config p/security-audit --error --metrics off src/" }
    security_gitleaks: { available: true, command: "gitleaks detect --source . --redact -v (via gitleaks-action@v2 in CI)" }
    security_codeql: { available: true, command: "codeql-action security-extended (weekly Mondays 06:30 UTC + PR)" }
    sonarcloud: { available: conditional, note: "sonarcloud.yml gated on SONAR_TOKEN secret (env pypi), projectKey CristianMz21_normadocs" }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Quantify impact on pipeline stages (preprocess/pandoc/formatter/pdf/verify)
    - No NOSONAR / no hidden exclusions; zero-suppression policy applies
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference academic standards explicitly (APA7/ICONTEC/IEEE) where relevant
  design:
    - Include sequence diagrams for complex flows (pipeline, pandoc subprocess, LT, PDF fallback)
    - Document architecture decisions with rationale and alternatives
    - Respect formatter subpackage boundary: formatters/apa/ is real impl, formatters/apa.py is shim (do not add code there)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Enforce 400-line Review Workload Forecast; split via chained PRs when needed
  apply:
    - Follow existing code patterns (Annotated Typer params, get_config() for YAML, docx_helpers for python-docx, subprocess wrapper)
    - tdd: true
    - test_command: "pytest tests/ -W error --cov=normadocs --cov-report=term-missing --cov-report=xml --cov-fail-under=78"
    - No suppressions: no # noqa, # type: ignore, # nosec, # B###, # pyright: ignore; fix underlying issue
    - Verify with scripts/find_suppressions.sh before commit
  verify:
    test_command: "pytest tests/ -W error --cov=normadocs --cov-report=term-missing --cov-report=xml --cov-fail-under=78"
    build_command: "python -m build && twine check dist/*"
    coverage_threshold: 78
    extra_checks:
      - "ruff check src/ tests/ --no-cache (RUFF_NOQA=1) → 0 annotations"
      - "ruff format --check src/ tests/ --no-cache"
      - "mypy --strict src/"
      - "pyright"
      - "bandit -r src/normadocs -c pyproject.toml"
      - "semgrep scan --config p/python --config p/security-audit --error src/"
  archive:
    - Warn before merging destructive deltas
    - Never delete archived changes; move to openspec/changes/archive/YYYY-MM-DD-{change-name}/

# Security posture — hybrid + max scrutiny as requested
security:
  zero_suppression_policy: true
  ruff_noqa: "1"
  annotations_check: "final job fails on any GitHub annotation (ruff/pyright/semgrep/bandit)"
  no_nosonar: true
  exclusions_must_be_justified: true
  workflows: ["ci.yml (quality+security+gitleaks+tests+build+annotations-check)", "codeql.yml (security-extended weekly)", "sonarcloud.yml (conditional on SONAR_TOKEN)"]

# Engram persistence (hybrid mode writes both)
engram:
  project_context_topic: "sdd-init/APAScript"
  testing_capabilities_topic: "sdd/APAScript/testing-capabilities"
  skill_registry_topic: "skill-registry"
  capture_prompt: false
